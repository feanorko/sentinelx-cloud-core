[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelx-core"
version = "0.1.0"
description = "SentinelX agent: connects a Linux server to sentinelx-hub via WebSocket"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Pensados", email = "[email protected]" }]

dependencies = [
    "websockets>=12.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "sentinelx-protocol @ git+https://github.com/pensados/sentinelx-protocol.git@v1.0.0",
]

[project.scripts]
sentinelx-core = "sentinelx_core.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelx_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
