# SentinelX Core - macOS example config (derived from config.example.yaml).
#
# allowed_commands: Linux-only tools (systemctl, journalctl, ip, ss, apt,
#   nft, wg, getfacl, ...) removed; macOS natives added (launchctl [broad],
#   log, sw_vers, sysctl, vm_stat, ifconfig, scutil, diskutil list/info,
#   dscl . -read/-list, defaults read, plutil, pbcopy/pbpaste, ...).
#   diskutil/dscl are intentionally read-only forms.
# services: uses the launchctl backend (unit = launchd label, domain =
#   system|gui/<uid>). Ships with 'sentinelx' so the agent can restart
#   itself via sentinel_service (launchctl kickstart -k).
# playbooks: macOS-native. Batch 1 = diagnostics (launchd/network/system).
#   Meta/self-management playbooks (add_allowed_command, add_service,
#   update_sentinelx_code, ...) come in batch 2.
# paths use ~ ; the installer realpaths them at install time.

allowed_commands:
- ls
- tree
- cat
- sudo cat
- head
- tail
- less
- grep
- sudo grep
- find
- sort
- wc
- stat
- realpath
- diff
- cmp
- jq
- uptime
- pwd
- whoami
- id
- du
- df
- lsof
- touch
- sudo touch
- echo
- printf
- tee
- sudo tee
- cp
- sudo cp
- mv
- sudo mv
- mkdir
- sudo mkdir
- rm
- sudo rm
- ln -s
- sudo ln -s
- unlink
- sudo unlink
- chmod
- sudo chmod
- chown
- sudo chown
- sed
- sudo sed
- netstat
- ping
- traceroute
- tcpdump
- dig
- nslookup
- curl
- wget
- docker
- sudo docker
- git
- gh
- sudo gh
- tar
- gzip
- unzip
- zip
- python3
- sudo python3
- bash -lc
- which
- cd
- launchctl
- sudo launchctl
- sw_vers
- sysctl
- vm_stat
- system_profiler
- pmset -g
- uname
- log show
- log stream
- ifconfig
- route -n get
- arp
- scutil
- networksetup
- dscacheutil
- diskutil list
- diskutil info
- dscl . -read
- dscl . -list
- defaults read
- plutil
- pbcopy
- pbpaste
- zsh -lc
services:
  sentinelx:
    unit: app.sentinelx.core
    domain: system
    actions:
    - status
    - restart
    - is-active
    requires_sudo: true
    description: The SentinelX agent itself (LaunchDaemon). restart = launchctl kickstart -k.
playbooks:
  launchd_debug:
    description: 'Inspect launchd service health on macOS (the systemd_debug equivalent).

      '
    when: 'User asks whether a service is running, to check the agent, or reports

      launchd issues. Triggers: "is X running", "check the sentinelx service",

      "system health", "what launchagents/daemons are loaded".

      '
    steps:
    - 'List loaded services: sentinel_exec ''launchctl list'' (user domain) or ''sudo launchctl list''
      for system-wide. Each line is PID / last-exit-status / label; PID ''-'' means loaded-but-not-running.'
    - 'For a service declared in policy, prefer the service op: sentinel_service action=''status'' service=''<name>''.
      It maps to ''launchctl print <domain>/<label>'' and shows state, pid, run count, and keepalive/runatload
      flags.'
    - 'Check the agent itself: sentinel_service action=''status'' service=''sentinelx''. state = running
      confirms health; a climbing ''runs'' count across calls suggests a crash loop (check the logs).'
    - 'For a specific launchd label not in policy: sentinel_exec ''sudo launchctl print system/<label>''
      (system daemon) or ''launchctl print gui/$(id -u)/<label>'' (user agent).'
    - 'Read a service''s logs: check its StandardErrorPath/StandardOutPath, or sentinel_exec ''log show
      --predicate \''process == "<name>"\'' --last 10m''.'
    requires:
    - launchctl in the allowlist (default macOS config).
    - sudo launchctl for the system domain (set up by the installer's sudoers).
    notes:
    - 'macOS has no systemctl. Services live in launchd ''domains'': system/<label> for LaunchDaemons
      (boot, root), gui/<uid>/<label> for LaunchAgents (login session).'
    - '''launchctl print'' on a system daemon needs sudo; on a gui agent it does not.'
    - 'The SentinelX agent''s own service key is ''sentinelx'' (label app.sentinelx.core, system domain).
      Restarting it is a self-restart: the WS session drops (read_loop_ended) and the agent reconnects
      automatically.'
  network_debug:
    description: 'Basic network diagnostic on macOS - interfaces, routes, listening ports,

      DNS, and reachability.

      '
    when: 'User reports network issues or asks what''s listening on a port. Triggers:

      "internet not working", "can''t reach X", "what''s on port Y", "check DNS".

      '
    steps:
    - 'Interfaces and IPs: sentinel_exec ''ifconfig'' (or ''ifconfig en0'' for the primary interface).
      macOS uses ifconfig, not ''ip a''.'
    - 'Routing table / default gateway: sentinel_exec ''netstat -rn''. The ''default'' line points at
      the gateway.'
    - 'Listening ports with the bound process: sentinel_exec ''lsof -i -P -n''. Filter to a port with
      ''lsof -i :PORT''. (netstat -an -p tcp also lists sockets but without process names.)'
    - 'DNS resolver config: sentinel_exec ''scutil --dns'' (shows the ordered resolvers macOS actually
      uses; /etc/resolv.conf is not authoritative on macOS).'
    - 'Reachability: sentinel_exec ''ping -c 3 <host>''. DNS lookup: sentinel_exec ''dig <domain>'' (or
      ''nslookup <domain>'').'
    requires:
    - ifconfig, netstat, lsof, scutil, ping, dig/nslookup in the allowlist (default macOS config).
    notes:
    - 'Key macOS/Linux differences: ''ip a'' -> ifconfig; ''ip route'' -> netstat -rn; ''ss -tuln'' ->
      lsof -i / netstat -an; resolv.conf -> scutil --dns.'
    - If ping fails but dig works, suspect ICMP filtering rather than real connectivity loss - try curl
      as an alternative reachability test.
    - 'For a specific interface''s status: ''ifconfig en0'' and ''networksetup -getinfo Wi-Fi''.'
  system_debug:
    description: 'System health snapshot on macOS - OS/hardware, memory, disk, power, and

      recent errors.

      '
    when: 'User asks for an overall machine snapshot or something feels off but the

      subsystem isn''t clear. Triggers: "system health", "what is this machine",

      "is it low on memory/disk", "why is it slow".

      '
    steps:
    - 'OS version/build: sentinel_exec ''sw_vers''.'
    - 'Hardware summary: sentinel_exec ''sysctl -n hw.model hw.ncpu hw.memsize'' (model, cores, RAM bytes).
      For a fuller report: ''system_profiler SPHardwareDataType'' (slower).'
    - 'Memory pressure: sentinel_exec ''vm_stat'' (page counts; multiply free/inactive by page size).
      ''top -l 1 -n 0'' also shows a PhysMem line.'
    - 'Disk usage: sentinel_exec ''df -h''. (Avoid recursive ''du'' on large trees - it''s slow.)'
    - 'Power/battery (laptops): sentinel_exec ''pmset -g'' for assertions and settings; ''pmset -g batt''
      for charge.'
    - 'Recent system errors: sentinel_exec ''log show --predicate \''messageType == error\'' --last 5m
      --style compact''. Widen the window if empty; narrow it if flooded.'
    requires:
    - sw_vers, sysctl, vm_stat, df, pmset, log show in the allowlist (default macOS config).
    notes:
    - '''log show'' replaces journalctl on macOS. It can be very verbose - always bound it with --last
      and a --predicate, and prefer --style compact.'
    - hw.memsize is in bytes; divide by 1073741824 for GiB.
    - system_profiler is thorough but can take several seconds; prefer sysctl for quick facts.
log:
  path: /var/log/sentinelx/core.log
  level: INFO
security:
  trusted_fetch_hosts:
  - drop.pensa.ar
  - get.sentinelx.app
  file_url_timeout_seconds: 15
file_ops:
  paths:
  - path: ~/sentinelx/workspace
    access: rw
upload_base: ~/sentinelx/uploads
