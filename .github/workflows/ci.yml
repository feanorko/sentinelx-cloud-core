name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke import
        run: python -c "import sentinelx_core; print(sentinelx_core.AGENT_VERSION)"

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tarball
        run: |
          # Strip dev artifacts and produce sentinelx-core-<arch>.tar.gz
          mkdir -p dist/sentinelx-core/{bin,src}
          cp -r src/sentinelx_core dist/sentinelx-core/src/
          cp pyproject.toml LICENSE README.md config.example.yaml dist/sentinelx-core/
          cp systemd/sentinelx-core.service dist/sentinelx-core/
          cd dist && tar czf sentinelx-core-x86_64.tar.gz sentinelx-core
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/sentinelx-core-*.tar.gz
