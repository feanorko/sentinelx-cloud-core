# Default config for sentinelx-cloud-core.
#
# Edit this file to control what the agent can do, then restart the service:
#   sudo systemctl restart sentinelx-cloud-core
#
# Security model:
#   - 'exec' op only runs commands prefix-matching this allowlist
#   - 'edit' op respects unix file permissions (sudo NOPASSWD if installed)
#   - 'service' op only manages units listed in `services:` below
#
# When in doubt, less is more. You can always add more later.

# ============================================================================
# Commands the agent can execute via the `exec` op.
# Empty or missing = nothing allowed (deny by default).
# ============================================================================
allowed_commands:

  # --- File & directory inspection ----------------------------------------
  - ls
  - tree
  - cat
  - sudo cat
  - head
  - tail
  - less
  - grep
  - sudo grep
  - find
  - sort
  - wc
  - stat
  - namei
  - realpath
  - diff
  - cmp
  - getfacl
  - jq

  # --- Disk & system info -------------------------------------------------
  - uptime
  - pwd
  - whoami
  - id
  - du -h
  - df -h
  - free
  - lsof

  # --- File manipulation --------------------------------------------------
  - touch
  - sudo touch
  - echo
  - printf
  - tee
  - sudo tee
  - cp
  - sudo cp
  - mv
  - sudo mv
  - mkdir
  - sudo mkdir
  - rm
  - sudo rm
  - ln -s
  - sudo ln -s
  - unlink
  - sudo unlink
  - chmod
  - sudo chmod
  - chown
  - sudo chown
  - sed
  - sudo sed

  # --- Networking ---------------------------------------------------------
  - ip a
  - ip route
  - ss -tuln
  - netstat -tuln
  - ping
  - traceroute
  - tcpdump
  - dig
  - nslookup
  - curl
  - wget

  # --- Service management -------------------------------------------------
  - systemctl
  - sudo systemctl
  - journalctl

  # --- Containers & orchestration ----------------------------------------
  - docker
  - sudo docker

  # --- Web servers --------------------------------------------------------
  - nginx -t
  - sudo nginx -t

  # --- Source control & build --------------------------------------------
  - git
  - gh
  - sudo gh
  - tar
  - gzip
  - unzip
  - zip

  # --- Package management -------------------------------------------------
  - apt

  # --- Scripting & shells -------------------------------------------------
  - python3
  - sudo python3
  - bash -lc
  - which
  - cd
  - set
  - if

  # --- Editors / structured edit -----------------------------------------
  - pensa-safe-edit
  - sudo pensa-safe-edit

  # --- Cloudflare tunnels (uncomment if you use cloudflared) -------------
  # - cloudflared tunnel list
  # - cloudflared tunnel run
  # - cloudflared tunnel info

  # --- WireGuard (uncomment if you have WG installed) --------------------
  # - wg
  # - sudo wg

  # --- USB / Android tooling (uncomment if needed) -----------------------
  # - lsusb
  # - adb
  # - sudo adb

  # --- Firewalling (uncomment if you actively manage nft/iptables) -------
  # - nft
  # - sudo nft
  # - iptables-legacy
  # - sudo iptables-legacy

  # --- SSH (uncomment to allow the agent to SSH out) ---------------------
  # - ssh
  # - sudo ssh

  # --- Custom internal tools you may have (uncomment & adjust if needed)
  # - pensa-cf-subdomain
  # - pensa-hosting-create
  # - pensa-mail
  # - pensa-docs
  # - pensa-summary
  # - pensa-ports

# ============================================================================
# Service units the agent is allowed to control via `service` / `restart`.
# Each service must list which actions are permitted.
# ============================================================================
services:
  nginx:
    actions: [status, start, stop, restart, reload]
  docker:
    actions: [status, restart]
  # The agent itself, so the LLM can reload policy after editing this
  # file. Restart re-reads /etc/sentinelx/config.yaml from scratch
  # (no SIGHUP-style reload). Conservative actions:
  #   status / is-active / is-enabled — pure inspection
  #   restart                          — reload policy or recover
  # Deliberately NOT start/stop: bringing the agent up/down is an
  # out-of-band operation; do that from a real terminal, not via the
  # agent itself (it can't remotely start itself once stopped).
  sentinelx-cloud-core:
    actions: [status, restart, is-active, is-enabled]
  # postgresql:
  #   actions: [status, start, stop, restart, reload]

# ============================================================================
# Playbooks the agent exposes to the LLM via `capabilities`.
#
# A playbook is a named, structured procedure the LLM can follow to perform
# a multi-step task on this host. Unlike a single command in
# `allowed_commands`, a playbook is a recipe: it documents the sequence of
# tool calls, the prerequisites, and any caveats. The LLM reads this from
# the capabilities response and follows the steps when the user's intent
# matches the `when` clause.
#
# The shape is flexible (dict[str, dict[str, Any]]). We use these keys by
# convention:
#   description: one-line summary
#   when:        natural-language trigger ("when should the LLM use this?")
#   steps:       ordered list of instructions, each phrased so the LLM can
#                act on them directly
#   requires:    prerequisites the operator must have set up beforehand
#   notes:       caveats, alternatives, security considerations
#
# The agent does NOT execute playbooks itself — they are pure documentation
# for the LLM. The actual work happens through the regular tools
# (sentinel_exec, sentinel_edit, sentinel_service).
# ============================================================================
playbooks:

  add_allowed_command:
    description: |
      How to add a new command to this host's allowlist persistently.
    when: |
      The user asks to allow a new command on this host (e.g. "let me run
      htop", "add ncdu to the allowlist", "I need ripgrep here"). Use this
      playbook to extend the policy permanently. For one-off needs,
      sentinel_script_run is usually a better fit.
    steps:
      - "Read the current config to confirm the file path and locate the
         allowed_commands section: call sentinel_exec with command 'sudo
         cat /etc/sentinelx/config.yaml'."
      - "Use sentinel_edit in 'replace' mode to insert the new command
         under the allowed_commands list. Anchor the edit on an existing
         '  - <something>' line that's adjacent to where the new entry
         logically belongs (alphabetical or by category). Pass sudo=true
         since /etc/sentinelx is root-owned. Use validator_preset='yaml' so
         the edit is rejected if it produces invalid YAML."
      - "Reload the agent so the new policy takes effect. Two paths,
         depending on whether 'sentinelx-cloud-core' is declared in
         this same config under services:
         (a) if declared: sentinel_service action='restart'
             service='sentinelx-cloud-core'. The WS session will drop
             when the agent restarts itself; this is expected and the
             agent reconnects automatically.
         (b) if NOT declared: ask the operator to run on a terminal
             'sudo systemctl restart sentinelx-cloud-core' once. After
             that one-time bootstrap, declaring sentinelx-cloud-core in
             services lets future restarts use path (a) without manual
             intervention. The default config.example.yaml ships with
             this service declared, so path (a) is the typical case."
      - "Verify the change took effect by calling sentinel_capabilities and
         confirming the new command appears in allowed_commands. If it
         doesn't, the agent didn't reload — check the journal with
         sentinel_exec 'sudo journalctl -u sentinelx-cloud-core -n 30'."
    requires:
      - "sudo access on /etc/sentinelx/config.yaml (set up by the installer)."
      - "Either: 'sentinelx-cloud-core' declared as a managed service in this
         same config (the default config.example.yaml ships it), OR a way to
         run 'sudo systemctl restart sentinelx-cloud-core' on a real terminal
         for the one-time bootstrap. Once the service is declared and the
         agent has loaded the new policy, future restarts can be done via
         sentinel_service without operator intervention."
    notes:
      - "If the user only needs the command for a single invocation, prefer
         sentinel_script_run over modifying the policy. Scripts run inside
         a subshell where every command is still allowlist-checked, so this
         is not a way to bypass policy — it's a way to compose allowed
         commands without persisting the new entry."
      - "Avoid adding commands that grant broad privilege escalation (su,
         chsh, visudo, unrestricted sudo, etc.) without warning the user.
         The whole point of the allowlist is to be conservative."
      - "Allowed commands are matched as PREFIXES, not exact strings. So
         'sudo cat' allows 'sudo cat /etc/passwd' but NOT 'sudo cattool'.
         When adding a new entry, think about what completions of that
         prefix should be reachable."

# ============================================================================
# Logging
# ============================================================================
log:
  path: /var/log/sentinelx/core.log
  level: INFO
